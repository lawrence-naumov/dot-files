# Alacritty — macOS

[env]
TERM = "alacritty"

[window]
dimensions = { columns = 120, lines = 30 }
padding = { x = 6, y = 4 }
dynamic_padding = true
option_as_alt = "Both"   # Option = Alt/Meta (M- в zsh и tmux)

[font]
normal = { family = "SF Mono", style = "Regular" }
bold = { family = "SF Mono", style = "Regular" }          # без жирного
bold_italic = { family = "SF Mono", style = "Regular Italic" }
size = 14.0

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Off" }

# ── gruvbox dark ─────────────────────────────────────────────────────────────
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
text = "#282828"
cursor = "#ebdbb2"

[colors.selection]
text = "CellForeground"
background = "#504945"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

# ── кириллическая раскладка ──────────────────────────────────────────────────
# На macOS Ctrl + кириллическая буква отправляет саму букву, а не управляющий
# код: не работают Ctrl-c в shell, Ctrl-b (prefix) в tmux, Ctrl-w в Neovim.
# Отправляем те же коды, что и Ctrl + латинская буква на той же клавише.
[[keyboard.bindings]]
key = "ф"
mods = "Control"
chars = "\u0001"  # Ctrl-a
[[keyboard.bindings]]
key = "и"
mods = "Control"
chars = "\u0002"  # Ctrl-b
